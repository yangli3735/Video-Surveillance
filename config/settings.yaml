# =============================================================================
#  settings.yaml — Week 1 Configuration
#  Intelligent Security & Abnormal Behavior Analysis System
#  Platform: NVIDIA Jetson Orin Nano · JetPack 6.1 · Docker (Option B)
# =============================================================================

# ---------- Camera (CSI on CAM0) ----------
# The Jetson Orin Nano CSI camera is accessed through the NVIDIA Argus daemon
# via the GStreamer element nvarguscamerasrc.  This is NOT a V4L2 USB camera.
camera:
  gstreamer_pipeline: >-
    nvarguscamerasrc sensor-id=0 !
    video/x-raw(memory:NVMM), width=1280, height=720, framerate=30/1 !
    nvvidconv ! video/x-raw, format=BGRx !
    videoconvert ! video/x-raw, format=BGR !
    appsink drop=1
  width: 1280
  height: 720
  fps: 30

# ---------- YOLO Inference ----------
inference:
  model_path: "data/models/yolov8n.pt"
  engine_path: "data/models/yolov8n.engine"
  use_tensorrt: false          # set true after running scripts/export_engine.sh
  confidence_threshold: 0.50
  iou_threshold: 0.45
  input_size: [640, 640]
  device: "cuda"

# ---------- Display ----------
display:
  enabled: true
  window_name: "Week1-Validation"
  show_fps: true
  show_labels: true
  show_confidence: true

# ---------- Logging ----------
logging:
  level: "INFO"                # DEBUG | INFO | WARNING | ERROR
  log_dir: "logs"
  max_bytes: 5242880           # 5 MB per log file
  backup_count: 3

